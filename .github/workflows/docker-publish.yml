name: Build & Push Docker Image

on:
  workflow_call:
    inputs:
      image_name:
        description: "Override image name (default: github.repository)"
        required: false
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      platforms:
        description: "Target platforms (comma-separated)"
        required: false
        type: string
        default: "linux/amd64"
      tag:
        description: "Image tag (default: latest). Pass e.g. a release version."
        required: false
        type: string
        default: "latest"
      build_args:
        description: >-
          Additional build-time variables, newline-delimited KEY=VALUE pairs,
          appended after the GIT_SHA arg this workflow always injects. Only
          takes effect for a variable the Dockerfile actually declares with
          ARG -- an unreferenced --build-arg is a harmless no-op, never a
          build failure.
        required: false
        type: string
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          NAME="${IMAGE_NAME:-${{ github.repository }}}"
          echo "name=ghcr.io/${NAME,,}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image Traceability Standard (Git & Release Standard, "Shared DevOps"):
      # every image this workflow publishes carries the source commit as both
      # an OCI label (docker inspect, no cooperation from the Dockerfile
      # needed) and a GIT_SHA build-arg (readable by the app at runtime, IF
      # the Dockerfile declares `ARG GIT_SHA` -- opt-in per repo). Exists
      # because a running container was found matching no build anyone could
      # account for, with no way to identify which commit produced it.
      - name: Compute build timestamp
        id: ts
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.ts.outputs.now }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

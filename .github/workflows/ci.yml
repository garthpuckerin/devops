name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reusable-workflow-contract:
    name: Reusable workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile node-verification contract
        run: node scripts/verify-node-verification-workflow.cjs
      - name: Exercise disagreement matrix
        run: node --test scripts/verify-node-verification-workflow.test.cjs
      - name: Validate workflow and shell syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
